<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f1fb;--card:#fff;--ink:#17142b;--mute:#6f6c85;--line:#e8e5f4;--soft:#f6f4fd;--p:#6d5dfc;--p2:#a855f7;--grad:linear-gradient(135deg,#5b4bf5,#9b4dfa);
--blue:#4f6bff;--green:#10b981;--amber:#f59e0b;--violet:#8b5cf6;--coral:#f43f5e;--gold:#ffd166;--sh:0 10px 30px -14px rgba(76,61,240,.35)}
[data-theme=dark]{--bg:#0d0b1c;--card:#171430;--ink:#f1effc;--mute:#9a97b4;--line:#2a2647;--soft:#1e1a3a;--blue:#7c93ff;--green:#34d399;--amber:#fbbf24;--violet:#a78bfa;--coral:#fb7185;--sh:0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Noto Sans Ethiopic',system-ui,-apple-system,sans-serif;padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,currentColor 14%,transparent)}
.blue{color:var(--blue)}.green{color:var(--green)}.amber{color:var(--amber)}.violet{color:var(--violet)}.coral{color:var(--coral)}
.hero{position:relative;overflow:hidden;margin:12px 14px;padding:20px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#4637e8,#8b3ff5 58%,#d946ef);box-shadow:0 18px 40px -16px rgba(91,75,245,.7)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{width:180px;height:180px;right:-50px;top:-60px}.hero:after{width:120px;height:120px;left:-40px;bottom:-50px}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}.brand em{font-style:normal;font-weight:600;opacity:.8;font-size:15px;margin-left:4px}
.lg{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);font-size:12.5px;font-weight:700;cursor:pointer}
.hero small{opacity:.8}.amt{font-size:34px;font-weight:800;color:var(--gold);letter-spacing:-.5px;line-height:1.15}
.pills{display:flex;gap:8px;margin-top:14px}
.pill2{flex:1;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-size:12px}
.pill2 b{display:block;font-size:18px}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:14px;border:0;background:#fff;color:#4a3bd8;font:inherit;font-size:14px;font-weight:700}
.acts button.g{background:rgba(255,255,255,.18);color:#fff}
main{padding:0 14px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh h2{margin:0;font-size:16.5px}.sh p{margin:0;font-size:12.5px;color:var(--mute)}
.num{width:28px;height:28px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
label.l{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input,textarea,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);font:inherit;outline:0;transition:.15s}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 15%,transparent)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:13.5px;font-weight:500}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.hs{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 10px;padding:2px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .chip{white-space:nowrap}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border:0;border-radius:11px;background:none;color:var(--mute);font:inherit;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px -10px rgba(91,75,245,.8)}
.btn:disabled{opacity:.5}.btn.soft{background:var(--soft);color:var(--ink);box-shadow:none}.btn.sm{padding:10px;margin-top:8px;font-size:13.5px;border-radius:12px}
.btn.green{background:linear-gradient(135deg,#059669,#10b981);color:#fff}.btn.red{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral);box-shadow:none}
.two{display:flex;gap:8px}.two .btn{margin-top:8px}
.bubble{background:var(--soft);border-radius:18px 18px 18px 4px;padding:8px;margin-top:6px;max-width:94%;word-break:break-word;font-size:14px}
.bubble img{width:100%;border-radius:12px;display:block;margin-bottom:6px}.bubble .t{padding:2px 6px 4px}.bubble .hint{color:var(--mute)}
.bubble .bt{margin:6px 4px 2px;padding:8px;text-align:center;border-radius:10px;background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);font-weight:600}
.search{position:relative;margin-bottom:10px}.search .i{position:absolute;left:13px;top:14px;color:var(--mute)}.search input{padding-left:42px}
.ch{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:8px;transition:.15s}
.ch.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 9%,transparent);transform:scale(.99)}
.av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.ch .m{flex:1;min-width:0}.ch .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch .m small{color:var(--mute)}
.pr{text-align:right}.pr b{color:var(--amber);display:block;line-height:1.2}.pr small{color:var(--mute);font-size:11px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.ch.on .tick{background:var(--grad);border-color:transparent}.tick .i{width:14px;height:14px;stroke-width:3}
.toggle{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;background:var(--soft)}
.toggle div{flex:1}.toggle small{color:var(--mute)}
.sw{width:48px;height:29px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:22px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:10px 12px 10px 18px;border-radius:22px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 12px 34px -10px rgba(40,30,120,.45);display:flex;align-items:center;gap:12px;z-index:5}
.bar .s{flex:1}.bar small{color:var(--mute);display:block;line-height:1.2}.bar b{font-size:20px;color:var(--amber)}
.bar button{padding:13px 20px;border:0;border-radius:15px;background:var(--grad);color:#fff;font:inherit;font-weight:700;display:flex;gap:8px;align-items:center}.bar button:disabled{opacity:.45}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);box-shadow:0 12px 34px -10px rgba(40,30,120,.5);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 2px 6px;border-radius:18px;color:var(--mute);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
nav button.on{background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .m{flex:1;min-width:0}.row small{color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,currentColor 13%,transparent);white-space:nowrap}
.badge .i{width:13px;height:13px;stroke-width:2.6}
.prog{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--grad);border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:24px 10px}.empty .ic{margin:0 auto 10px;width:56px;height:56px;border-radius:18px}
.steps{margin:6px 0 0;padding:0;list-style:none}.steps li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.box{background:var(--soft);border-radius:16px;padding:14px;margin-top:10px;white-space:pre-line}
.code{font-size:28px;font-weight:800;letter-spacing:1.5px;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ok-big{width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);display:grid;place-items:center;margin:6px auto 12px}.ok-big .i{width:34px;height:34px;stroke-width:3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:18px;background:var(--soft)}.stat small{color:var(--mute);display:block}.stat b{font-size:21px}
.toast{position:fixed;left:14px;right:14px;top:12px;padding:13px 16px;border-radius:16px;background:#1e1a3a;color:#fff;z-index:20;display:flex;gap:10px;align-items:center;transform:translateY(-90px);transition:.25s;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.toast.show{transform:none}.toast.err{background:#be123c}
.skel{border-radius:24px;height:120px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--soft) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel,.card{animation:none}.toast,.sw::after{transition:none}}
</style>
</head>

  const upd = () => {

    $('#prev').innerHTML = (d.photo ? `<img src="${esc(d.photo)}" onerror="this.remove()">` : '') + `<div class="t">${d.html ? clean(d.html) : '<span class="hint">' + t('Your preview appears here') + '</span>'}</div>` + (d.btnT && d.btnU ? `<div class="bt">${esc(d.btnT)}</div>` : '');
    $('#tot').textContent = birr(total()); $('#cnt').textContent = S.picked.size + ' ' + t('selected') + ' · ' + d.hours + ' ' + t('hours');
    $('#go').disabled = !d.html.trim() || !S.picked.size || (d.sched && !d.when);
  };
  const bind = () => view.querySelectorAll('.ch').forEach(el => el.onclick = () => { const id = +el.dataset.id; S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); el.classList.toggle('on'); hap(); upd(); });
  ['#html', '#photo', '#btnT', '#btnU', '#when', '#coupon'].forEach(s => $(s).oninput = upd);
  $('#q').oninput = e => { S.q = e.target.value; $('#list').innerHTML = chList(); bind(); };
  $('#cats').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.cat = b.dataset.c; $('#cats').innerHTML = catChips(); $('#list').innerHTML = chList(); bind(); hap(); };
  $('#sorts').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.sort = b.dataset.s; document.querySelectorAll('#sorts .chip').forEach(c => c.classList.toggle('on', c === b)); $('#list').innerHTML = chList(); bind(); hap(); };
  $('#hours').oninput = e => { d.hours = Math.min(168, Math.max(1, +e.target.value || 1)); document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', +c.dataset.h === d.hours)); upd(); };
  $('#chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; d.hours = +b.dataset.h; $('#hours').value = d.hours; document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c === b)); hap(); upd(); };
  $('#pin').onclick = e => { d.pin = !d.pin; e.currentTarget.classList.toggle('on', d.pin); hap(); upd(); };
  $('#sched').onclick = e => { d.sched = !d.sched; e.currentTarget.classList.toggle('on', d.sched); $('#when').style.display = d.sched ? 'block' : 'none'; hap(); upd(); };
  bind();
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    const r = await api('/order', { html: d.html, photo: d.photo, hours: d.hours, pin: d.pin, channels: [...S.picked], btn_text: d.btnT, btn_url: d.btnU, start_at: d.sched && d.when ? Date.parse(d.when) : 0, coupon: d.coupon });
    if (r.error) { toast(r.error, true); upd(); return; }
    S.done = r; S.d = blank(); S.picked.clear(); await load();
  };
  upd();
}
async function payOnline(id) {
  const r = await api('/order/pay', { id });
  if (r.error) return toast(r.error, true);
  tg.openLink ? tg.openLink(r.url) : window.open(r.url, '_blank'); toast(t('After paying, come back and tap Refresh'));
}
function vDone() {
  const d = S.done;
  view.innerHTML = `<div class="card"><div class="ok-big">${ico('check')}</div>
    <div style="text-align:center"><b style="font-size:19px">${t('Order created')}</b><br><small style="color:var(--mute)">${t('Total to pay')}</small><div style="font-size:30px;font-weight:800;color:var(--amber)">${birr(d.total)}</div>${d.discount ? `<small class="green">${t('Discount applied')}: -${birr(d.discount)}</small>` : ''}</div>
    <div class="box"><div style="text-align:center;color:var(--mute);font-size:13px">${t('Order code')}</div><div class="code">${d.code}</div></div>
    <button class="btn soft" id="cp">${ico('copy')}${t('Copy code')}</button>
    ${d.chapa ? `<button class="btn green" id="pay">${ico('card')}${t('Pay online (Chapa)')}</button>` : ''}</div>
  <div class="card"><div class="sh"><div><h2>${d.chapa ? t('Or pay manually') : t('How to pay')}</h2></div></div><div class="box" style="margin-top:0">${esc(S.me.payInfo)}</div>
    <ul class="steps">
      <li><span class="num">1</span><div>${t('Pay to the account above and write the code')} <b>${d.code}</b> ${t('in the payment note.')}</div></li>
      <li><span class="num">2</span><div>${t('Send the payment screenshot to the bot chat.')}</div></li>
      <li><span class="num">3</span><div>${t('After an administrator approves it, your ad is posted automatically.')}</div></li></ul>
    <small style="color:var(--mute)">${t('Unpaid orders expire after 24 hours.')}</small>
    <button class="btn" id="bot">${ico('send')}${t('Go to the bot')}</button></div>`;
  $('#cp').onclick = () => copy(d.code, 'Code copied');
  if ($('#pay')) $('#pay').onclick = () => payOnline(d.id);
  $('#bot').onclick = () => tg.close();
}

// ---------- Publisher ----------
function vChan() {
  const code = S.me.me.code || '';
  const P = i => `<span class="num" style="background:var(--violet)">${i}</span>`;
  view.innerHTML = `
  <div class="card"><div class="sh">${tile('chan', 'violet')}<div><h2>${t('Earn from your channel or group')}</h2><p>${t('You receive')} ${S.me.ownerShare}% ${t('of every ad price')}</p></div></div>
    <ul class="steps"><li>${P(1)}<div>${t('Add this bot as an administrator (Post Messages for channels, Send Messages and Photos for groups).')}</div></li>
    <li>${P(2)}<div>${t('Enter the public username below, or run the /connect command with your code inside the chat.')}</div></li>
    <li>${P(3)}<div>${t('An administrator approves it and you can receive ads.')}</div></li></ul></div>
  <div class="card"><div class="sh">${tile('key', 'amber')}<div><h2>${t('Your verification code')}</h2><p>${t('For private groups and channels')}</p></div></div>
    <div class="box" style="margin-top:0"><div class="code">${esc(code)}</div></div>
    <button class="btn soft" id="cc">${ico('copy')}${t('Copy /connect command')}</button></div>
  <div class="card"><div class="sh"><h2>${t('Add by username')}</h2></div>
    <label class="l" style="margin-top:0">${t('Channel or group username')}</label><input id="un" placeholder="@mychannel" autocapitalize="off">
    <label class="l">${t('Category')}</label><div class="hs" id="rc">${S.me.cats.map(c => `<button class="chip ${S.regCat === c ? 'on' : ''}" data-c="${c}">${cap(c)}</button>`).join('')}</div>
    <label class="l">${t('Your price per hour (optional)')}</label><input id="pr" type="number" inputmode="numeric" placeholder="${t('Leave empty to price by member count')}">
    <button class="btn" id="reg">${ico('plus')}${t('Submit for approval')}</button></div>
  <div class="card"><div class="sh"><h2>${t('My channels and groups')}</h2></div>${S.mine.channels.length ? S.mine.channels.map(c => `<div class="row">${av(c.title)}<div class="m"><b>${esc(c.title)}</b><br><small>${esc(handle(c))} · ${kfmt(c.subs)} · ${cap(c.category)} · ${birr(c.price)}/h</small></div>${badge(c.status)}</div>`).join('') : empty('inbox', 'violet', t('You have not added a channel yet'))}</div>`;
  $('#cc').onclick = () => copy('/connect ' + code, 'Copied. Paste it inside your group or channel.');
  $('#rc').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.regCat = b.dataset.c; document.querySelectorAll('#rc .chip').forEach(c => c.classList.toggle('on', c === b)); hap(); };
  $('#reg').onclick = async () => {
    $('#reg').disabled = true;
    const r = await api('/channel', { username: $('#un').value, price: $('#pr').value, category: S.regCat });
    r.error ? toast(r.error, true) : toast(t('Submitted. You will be notified after approval.'));
    await load();
  };
}

// ---------- Wallet ----------
function vWallet() {
  const m = S.me, link = `https://t.me/${m.botUsername || 'YOUR_BOT'}?start=ref_${m.me.id}`;
  view.innerHTML = `
  <div class="card"><div class="sh">${tile('out', 'amber')}<div><h2>${t('Withdraw')}</h2><p>${t('Minimum')} ${birr(m.minWithdraw)}</p></div></div>
    <label class="l" style="margin-top:0">${t('Amount (ETB)')}</label><input id="amt" type="number" inputmode="numeric" placeholder="0">
    <div class="chips" style="margin-top:8px"><button class="chip" id="all">${t('Max')} (${birr(m.me.balance)})</button></div>
    <label class="l">${t('Method')}</label><div class="seg" id="seg"><button data-m="Telebirr" class="${S.method === 'Telebirr' ? 'on' : ''}">Telebirr</button><button data-m="CBE" class="${S.method === 'CBE' ? 'on' : ''}">CBE</button></div>
    <label class="l">${t('Account or phone number')}</label><input id="acc" inputmode="numeric">
    <button class="btn" id="wd" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1200">${ico('out')}${t('Request withdrawal')}</button></div>
  <div class="card"><div class="sh">${tile('gift', 'green')}<div><h2>${t('Invite friends')}</h2><p>${t('Earn')} ${m.refPercent}% ${t('when someone you invited pays for an ad')}</p></div></div>
    <div class="grid"><div class="stat"><small>${t('Invited')}</small><b>${m.refCount}</b></div><div class="stat"><small>${t('Earned')}</small><b>${birr(m.me.ref_earned || 0)}</b></div></div>
    <button class="btn soft" id="rl">${ico('link')}${t('Copy invite link')}</button></div>
  <div class="card"><div class="sh"><h2>${t('Withdrawal history')}</h2></div>${m.withdrawals.length ? m.withdrawals.map(w => `<div class="row">${tile('out', w.status === 'paid' ? 'green' : w.status === 'rejected' ? 'coral' : 'amber')}<div class="m"><b>${birr(w.amount)}</b><br><small>${w.method} · ${esc(w.account)}</small></div>${badge(w.status)}</div>`).join('') : empty('wallet', 'amber', t('No withdrawals yet'))}</div>`;
  $('#rl').onclick = () => copy(link, 'Link copied');
  $('#all').onclick = () => { $('#amt').value = Math.floor(m.me.balance); hap(); };
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.method = b.dataset.m; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); hap(); };
  $('#wd').onclick = async () => {
    $('#wd').disabled = true;
    const r = await api('/withdraw', { amount: $('#amt').value, method: S.method, account: $('#acc').value });
    r.error ? toast(r.error, true) : toast(t('Request sent'));
    await load();
  };
}

// ---------- Orders ----------
function vOrders() {
  const o = S.mine.orders;
  view.innerHTML = `<button class="btn soft sm" id="rf" style="margin:0 0 12px">${ico('refresh')}${t('Refresh')}</button>` + (o.length ? o.map(x => `<div class="card"><div class="row" style="padding-top:0"><div class="m"><b style="font-size:17px">${x.code}</b><br><small>${birr(x.total)} · ${x.hours}h${x.start_at > Date.now() ? ' · ' + t('Starts') + ' ' + new Date(x.start_at).toLocaleString() : ''}</small></div>${badge(x.status)}</div>
    ${x.items.map(i => { const p = i.status === 'live' && i.ends_at ? Math.min(100, Math.max(0, 100 - (i.ends_at - Date.now()) / (x.hours * 36000))) : 0;
      return `<div class="row">${tile('chan', 'violet')}<div class="m"><b>${esc(i.name)}</b>${i.status === 'live' && i.ends_at ? `<br><small>${left(i.ends_at)} ${t('left')}</small><div class="prog"><i style="width:${p}%"></i></div>` : ''}${x.btn && i.clicks ? `<br><small>${i.clicks} ${t('clicks')}</small>` : ''}</div>${badge(i.status)}</div>`; }).join('')}
    ${x.status === 'awaiting_pay' ? `<div class="box" style="font-size:14px">${t('Pay, then send the payment screenshot to the bot chat. Include code')} ${x.code} ${t('in the payment note.')}</div>
      <div class="two">${S.me.chapa ? `<button class="btn green sm" data-a="pay" data-id="${x.id}">${ico('card')}${t('Pay online')}</button>` : ''}<button class="btn red sm" data-a="cancel" data-id="${x.id}">${ico('x')}${t('Cancel order')}</button></div>`
      : `<button class="btn soft sm" data-a="repeat" data-id="${x.id}">${ico('refresh')}${t('Repeat')}</button>`}</div>`).join('')
    : `<div class="card">${empty('list', 'green', t('No orders yet'))}<button class="btn" id="n">${ico('ads')}${t('Create an ad')}</button></div>`);
  $('#rf').onclick = load;
  view.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.id, a = b.dataset.a;
    if (a === 'pay') return payOnline(id);
    if (a === 'cancel') { if (!confirm(t('Cancel this order?'))) return; const r = await api('/order/cancel', { id }); r.error ? toast(r.error, true) : toast(t('Order cancelled')); return load(); }
    const r = await api('/order/repeat', { id }); if (r.error) return toast(r.error, true);
    S.tab = 'ads'; S.done = r; await load();
  });
  const n = $('#n'); if (n) n.onclick = () => go('ads');
}

// ---------- Admin ----------
async function vAdmin() {
  view.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const r = await api('/admin/stats'); if (r.error) { view.innerHTML = `<div class="card empty">${tile('warn', 'coral')}${esc(r.error)}</div>`; return; }
  const s = r.stats;
  view.innerHTML = `
  <div class="card"><div class="sh">${tile('chart', 'blue')}<div><h2>${t('Dashboard')}</h2></div></div>
    <div class="grid"><div class="stat"><small>${t('Users')}</small><b>${s.users}</b></div><div class="stat"><small>${t('Channels')}</small><b>${s.channels}</b></div>
    <div class="stat"><small>${t('Live ads')}</small><b>${s.live}</b></div><div class="stat"><small>${t('Paid orders')}</small><b>${s.paid_orders}</b></div></div>
    <div class="stat" style="margin-top:10px"><small>${t('Revenue')}</small><b style="color:var(--amber)">${birr(s.revenue)}</b></div></div>
  <div class="card"><div class="sh"><div><h2>${t('Pending')}</h2><p>${t('Waiting for approval (use the bot buttons)')}</p></div></div>
    <div class="grid"><div class="stat"><small>${t('Orders')}</small><b>${r.pendingOrders.length}</b></div><div class="stat"><small>${t('Channels')}</small><b>${r.pendingChannels.length}</b></div><div class="stat"><small>${t('Withdrawals')}</small><b>${r.pendingWd.length}</b></div></div></div>
  <div class="card"><div class="sh">${tile('shield', 'coral')}<div><h2>${t('Block or unblock a user')}</h2></div></div>
    <input id="uid" inputmode="numeric" placeholder="${t('User ID')}"><div class="two"><button class="btn red sm" id="bn">${t('Block')}</button><button class="btn soft sm" id="ub">${t('Unblock')}</button></div></div>
  <div class="card"><div class="sh">${tile('tag', 'green')}<div><h2>${t('Coupons')}</h2></div></div>
    ${r.coupons.map(c => `<div class="row"><div class="m"><b>${esc(c.code)}</b><br><small>${c.percent}% · ${c.uses} ${t('uses left')}</small></div></div>`).join('')}
    <label class="l">${t('Code')}</label><input id="cc" autocapitalize="characters"><label class="l">${t('Percent')}</label><input id="cp" type="number" inputmode="numeric" placeholder="10"><label class="l">${t('Uses')}</label><input id="cu" type="number" inputmode="numeric" placeholder="50">
    <button class="btn" id="sc">${t('Save coupon')}</button></div>`;
  const ban = v => async () => { const x = await api('/admin/ban', { user_id: $('#uid').value, ban: v }); x.error ? toast(x.error, true) : toast(t('Done')); };
  $('#bn').onclick = ban(true); $('#ub').onclick = ban(false);
  $('#sc').onclick = async () => { const x = await api('/admin/coupon', { code: $('#cc').value, percent: $('#cp').value, uses: $('#cu').value }); x.error ? toast(x.error, true) : (toast(t('Done')), vAdmin()); };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && ['orders', 'wallet'].includes(S.tab)) load(); });
load();
</script>
