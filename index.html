<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Addis Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">

<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--cap:#8a9bb4;--line:#dce5ef;--soft:#f6f9fc;--p:#229ed9;--pbg:#eef8fd;--dk:#111827;--green:#10b981;--amber:#f59e0b;--coral:#e11d48;--sh:0 10px 30px -18px rgba(15,23,42,.3)}
[data-theme=dark]{--bg:#0a111e;--card:#121b2d;--ink:#e8eef8;--mute:#93a3ba;--cap:#6b7d99;--line:#233048;--soft:#172238;--pbg:#0f2a3c;--dk:#050a14;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,'Noto Sans Ethiopic',system-ui,-apple-system,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.flow{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:99px;padding:8px 16px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--p);color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.ib.sq{border-radius:14px;border:0;background:var(--soft);width:44px;height:44px}
.ib.dk{background:rgba(255,255,255,.1);color:#cbd5e1;border:0;border-radius:12px;width:40px;height:40px}
.wchip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700}
.wchip .i{color:var(--p)}
main{padding:14px}
.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.cap{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--cap);text-transform:uppercase;margin-bottom:8px}
.cap .i{color:var(--p);width:22px;height:22px}.cap .tz{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;background:var(--pbg);color:var(--p);padding:5px 12px;border-radius:99px}
.sub{font-size:13.5px;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.r2{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}.r2 span{font-size:12.5px;color:var(--mute)}
.box{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px}
.bl{color:var(--p);font-weight:700}
.dash{border:1.5px dashed var(--line);border-radius:20px;padding:22px 18px;text-align:center;color:var(--mute);margin-top:8px}
.pk{display:block;text-align:left;padding:16px;border-radius:22px;border:1.5px solid var(--line);background:var(--soft);min-height:150px}
.pk small{display:block;font-weight:700;color:#1b78a6;letter-spacing:.5px;font-size:12px}[data-theme=dark] .pk small{color:#5cc0ee}
.pk b{display:block;margin:6px 0 10px;font-size:15.5px}.pk h3{margin:0 0 6px;font-size:23px}.pk span{font-size:13px;color:var(--mute)}
.pk.on,.slot.on,.kt.on,.pm.on,.bank.on{border-color:var(--p);background:var(--pbg);box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 25%,transparent)}
.dn{display:flex;gap:8px;margin-top:10px}.dn input{flex:1}
.btn2{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 16px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn2:disabled{opacity:.45}
.ok-pill{background:#d9f7ea;color:#0a7a50;font-weight:700;font-size:13px;padding:6px 14px;border-radius:99px;white-space:nowrap}.ok-pill.b{background:var(--pbg);color:var(--p)}
.slot{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:12px 14px;display:block}
.slot span{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}.slot span .i{width:18px;height:18px;color:var(--mute)}
.slot em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--mute);padding:3px 8px;border-radius:8px}
.slot b{display:block;color:var(--p);margin-top:6px;font-size:14px}.slot small{color:var(--mute);font-size:13px}
.slot.on{background:var(--p);border-color:var(--p);color:#fff}.slot.on b,.slot.on small,.slot.on span .i{color:#fff}.slot.on em{background:rgba(255,255,255,.25);color:#fff}
.slot:disabled{opacity:.5;background:var(--soft)}.slot:disabled span,.slot:disabled b{text-decoration:line-through;color:var(--mute)}
input,select,textarea{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{min-height:150px;resize:vertical;border-radius:20px}
input[type=file]{padding:10px;background:var(--soft)}
select{width:auto;padding:8px 34px 8px 16px;border-radius:99px;background:var(--soft);font-weight:700}
label.l{display:block;font-weight:700;margin:16px 0 8px;font-size:15px}
.lr{display:flex;align-items:center;gap:10px;margin-top:16px}.lr label{flex:1;margin:0}.lr .cnt{color:var(--cap);font-size:13.5px}
.err{color:var(--coral);font-size:13px;margin-top:6px}
.steps{display:flex;gap:8px;margin-top:14px}
.steps button{flex:1;border:0;border-radius:99px;padding:12px 6px;font-weight:700;font-size:14px;background:var(--pbg);color:#1b78a6}
.steps button.on{background:var(--p);color:#fff}.steps button.off{background:var(--soft);color:var(--cap)}
.fh{display:flex;align-items:center;gap:12px}.fh .m{min-width:0}.fh b{display:block;font-size:19px;line-height:1.2}
.lk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14.5px;flex-wrap:wrap}.lk a{color:var(--p);font-weight:600;text-decoration:none}.lk .i{width:16px;height:16px}
.av{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;background:var(--p)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;border:0}
.ch .m{flex:1;min-width:0}.ch .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch small{color:var(--mute)}
.pr{text-align:right}.pr b{display:block;color:var(--p)}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.search{position:relative;margin-bottom:10px}.search .i{position:absolute;left:16px;top:15px;color:var(--mute)}.search input{padding-left:44px}
.tabs2{display:flex;background:var(--card);border-radius:26px;padding:6px;gap:6px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs2 button{flex:1;border:0;background:none;border-radius:20px;padding:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute)}
.tabs2 button.dk{background:var(--dk);color:#fff}
.kt,.pm{border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:16px;text-align:left;font-weight:700}
.kt{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink)}.kt.on{color:var(--p)}
.pm .i{width:26px;height:26px;color:var(--p)}.pm b{display:block;margin-top:10px;font-size:16px}.pm small{color:var(--mute);font-weight:500;font-size:14px}
.warn{background:#fff7dc;color:#8a4b0a;border-radius:18px;padding:14px 16px;margin-top:14px;font-size:15px}[data-theme=dark] .warn{background:#3a2d0c;color:#f5c26b}
.pbox{border:1.5px solid var(--line);background:var(--soft);border-radius:24px;padding:16px;margin-top:14px}
.thumbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.th{position:relative;width:104px;height:104px;border-radius:20px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.th i{position:absolute;left:6px;top:6px;background:rgba(15,23,42,.65);color:#fff;font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.th button{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,23,42,.65);color:#fff;display:grid;place-items:center;padding:0}.th button .i{width:14px;height:14px}
.addp{width:104px;height:104px;border:2px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--p);font-size:13.5px;cursor:pointer}
.lnk{border:0;background:none;color:var(--p);font-weight:700;display:flex;align-items:center;gap:4px}
.tgbg{background:#d7e6f2;border-radius:20px;padding:14px}[data-theme=dark] .tgbg{background:#0e1a2b}
.bub{background:#fff;color:#111;border-radius:16px 16px 16px 4px;padding:6px;max-width:92%;word-break:break-word;font-size:14.5px;overflow:hidden}[data-theme=dark] .bub{background:#1d2b40;color:#e8eef8}
.bub .t{padding:6px 8px}.bub .hint{color:#8a9bb4}.bub a{color:var(--p);pointer-events:none}.bub code,.bub pre{background:rgba(0,0,0,.08);border-radius:4px;padding:0 3px}
.pg{display:grid;gap:2px;border-radius:12px;overflow:hidden}.pg img{width:100%;height:100%;object-fit:cover;display:block}.pg1{grid-template-columns:1fr}.pg2,.pg4{grid-template-columns:1fr 1fr}.pg3{grid-template-columns:1fr 1fr}.pg3 img:first-child{grid-column:span 2;aspect-ratio:2/1}.pg5{grid-template-columns:repeat(3,1fr)}.pg5 img:first-child,.pg5 img:nth-child(2){grid-column:span 1}
.pg img{aspect-ratio:1/1}.pg1 img{aspect-ratio:auto;max-height:340px}
.cta{max-width:92%;margin-top:4px;text-align:center;font-weight:700;color:var(--p);background:rgba(34,158,217,.16);border-radius:10px;padding:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;color:var(--mute)}.kv b{color:var(--ink);text-align:right}
.kv.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:20px;color:var(--ink);font-weight:800}.kv.tot b{color:#17799f}
.bank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);width:100%;text-align:left;margin-top:10px}.bank b{display:block;font-size:17px}.bank small{color:var(--mute);font-size:15px}
.bank .num{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:8px 12px;color:var(--p);font-weight:700}.bank.on .num{background:#fff}
.stepno{font-weight:700;margin:4px 0 12px}
.wal{background:var(--dk);color:#fff;border-radius:28px;padding:22px;margin-bottom:14px}
.wal .t{display:flex;align-items:center;gap:8px;color:#94a3b8;font-weight:700;letter-spacing:.6px;font-size:14px}.wal .t .ib{margin-left:auto}
.wal .big{font-size:44px;font-weight:800;margin:12px 0 4px}.wal .big small{font-size:20px;color:#cbd5e1;font-weight:700}.wal .acc{color:#94a3b8;font-size:15px}
.tabs3{display:flex;background:var(--card);border-radius:26px;padding:6px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs3 button{flex:1;border:0;background:none;border-radius:20px;padding:13px 4px;font-weight:700;color:var(--mute)}.tabs3 button.dk{background:var(--dk);color:#fff}
.btn{width:100%;margin-top:14px;padding:16px;border:0;border-radius:99px;background:var(--p);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5}.btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.red{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}.btn.sm{padding:11px;font-size:14px;margin-top:10px}.btn.amber{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1200}
.two{display:flex;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:9}
.go{width:100%;padding:17px;border:0;border-radius:99px;background:var(--p);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.go.green{background:#14b886}.go:disabled{opacity:.45}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;padding:4px 0}
nav button .i{width:26px;height:26px}nav button.on{color:var(--p)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent)}.badge .i{width:13px;height:13px;stroke-width:2.6}
.b-amber{color:#d97706}.b-blue{color:var(--p)}.b-green{color:#0f9d6b}.b-coral{color:var(--coral)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .m{flex:1;min-width:0}.row small{color:var(--mute)}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.it span{flex:1}.it small{color:var(--mute)}
.rowh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.rowh h2{margin:0;font-size:20px}
.empty{text-align:center;color:var(--mute);padding:28px 14px}.empty .i{width:36px;height:36px;margin-bottom:8px;color:var(--p)}
.ok-big{width:72px;height:72px;border-radius:50%;background:#d9f7ea;color:#0a7a50;display:grid;place-items:center;margin:4px auto 12px}.ok-big .i{width:36px;height:36px;stroke-width:3}
.code{font-size:30px;font-weight:800;letter-spacing:1.5px;text-align:center;color:var(--p)}
.stat{padding:14px;border-radius:18px;background:var(--soft)}.stat small{display:block;color:var(--mute)}.stat b{font-size:21px}
.amt-p{color:#0f9d6b;font-weight:700}.amt-m{color:var(--coral);font-weight:700}
.toast{position:fixed;left:14px;right:14px;top:12px;padding:13px 16px;border-radius:16px;background:#1e293b;color:#fff;z-index:20;display:flex;gap:10px;align-items:center;transform:translateY(-110px);transition:.25s;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.toast.show{transform:none}.toast.err{background:#be123c}
.skel{border-radius:24px;height:120px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--soft) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}.toast{transition:none}}
</style>
</head>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) || { initData: '', colorScheme: 'light', ready() {}, expand() {}, close() { history.back(); } };
tg.ready(); tg.expand();
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let theme = ls.get('theme') || (tg.colorScheme === 'dark' || (!tg.initData && matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light');
const applyTheme = () => { document.documentElement.dataset.theme = theme; };
applyTheme();

// ---------- helpers ----------
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const view = $('#view'), barwrap = $('#barwrap');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const pad = n => String(n).padStart(2, '0');
const hap = () => tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
const kfmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : n;
const EAT = 3 * 3600e3, LEAD = 10 * 60e3;
const eatToday = () => new Date(Date.now() + EAT).toISOString().slice(0, 10);
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dlabel = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const slotUtc = (d, h) => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd, h - 3); };
const t12 = h => ((h % 12) || 12) + ':00 ' + (h % 24 < 12 ? 'AM' : 'PM');
const hrange = h => { const ap = x => x % 24 < 12 ? 'AM' : 'PM', n = x => (x % 12) || 12; return n(h) + ':00' + (ap(h) !== ap(h + 1) ? ' ' + ap(h) : '') + '–' + n(h + 1) + ':00 ' + ap(h + 1); };
const eatStr = ms => new Date(ms + EAT).toISOString().slice(5, 16).replace('T', ' ');
const left = ms => { const m = Math.max(0, Math.round((ms - Date.now()) / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm'; };
const dtime = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const COLORS = ['#229ed9', '#7c5cfc', '#0d9488', '#db2777', '#ea580c', '#2563eb'];
const av = (c, size) => `<span class="av" style="${size ? `width:${size}px;height:${size}px;` : ''}background:${COLORS[[...(c.title || '?')].reduce((a, x) => a + x.charCodeAt(0), 0) % COLORS.length]}">${esc([...(c.title || '?')][0].toUpperCase())}${c.photo ? `<img src="/avatar/${c.id}" onerror="this.remove()">` : ''}</span>`;
const cap = c => c.charAt(0).toUpperCase() + c.slice(1);

let tt; function toast(x, err) {
  const el = $('#toast'); el.className = 'toast show' + (err ? ' err' : '');
  el.innerHTML = ico(err ? 'warn' : 'check') + '<span>' + esc(x) + '</span>';
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3400);
  tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(err ? 'error' : 'success');
}
async function api(p, body) {
  try {
    const r = await fetch('/api' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-init-data': tg.initData }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) return { error: 'Open this app inside Telegram.' };
    return await r.json();
  } catch (e) { return { error: 'Connection failed. Please try again.' }; }
}
async function copy(x, msg) {
  try { await navigator.clipboard.writeText(x); toast(msg || 'Copied'); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = x; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} t.remove();
    ok ? toast(msg || 'Copied') : toast('Copy failed. Long-press the text to copy it.', true);
  }
}
// Compress a photo to a JPEG data URL, then upload it
async function up(file, max) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  let qlt = .85, d; do { d = c.toDataURL('image/jpeg', qlt); qlt -= .15; } while (d.length > 1.4e6 && qlt > .3);
  return api('/upload', { data: d });
}
const hasBadHtml = s => { const t = s.replace(/<\/?(?:b|strong|i|em|u|ins|s|strike|del|code|pre|blockquote|tg-spoiler)>|<a href="https?:\/\/[^"<>\s]*">|<\/a>/gi, ''); return /[<>]/.test(t) || /&(?!(?:amp|lt|gt|quot|#\d+|#x[0-9a-f]+);)/i.test(t); };
// Preview only: everything is escaped first, then the allowed tags are restored
const fmt = (s, pm) => {
  let x = esc(s);
  if (pm === 'HTML') x = x.replace(/&lt;(\/?(?:b|strong|i|em|u|ins|s|strike|del|code|pre|blockquote|tg-spoiler))&gt;/gi, '<$1>').replace(/&lt;a href=&quot;(https?:\/\/(?:[^&"<>\s]|&amp;)*)&quot;&gt;/gi, '<a href="$1">').replace(/&lt;\/a&gt;/gi, '</a>');
  else if (pm === 'Markdown') x = x.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/_([^_\n]+)_/g, '<i>$1</i>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"<>]+)\)/g, '<a href="$2">$1</a>');
  return x.replace(/\n/g, '<br>');
};

// ---------- state ----------
const mode0 = new URLSearchParams(location.search).get('mode');
const S = { me: null, mode: mode0 === 'publisher' ? 'publisher' : 'advertiser', tab: mode0 === 'publisher' ? 'chan' : 'explore', channels: [], mine: { channels: [], orders: [] }, wallet: { payments: [], ledger: [] }, q: '', cat: 'all', sort: 'pop', flow: null, wtab: 'topup', regCat: 'other', method: 'Telebirr', tf: { amount: '', tx: '', sn: '', sp: '', receipt: null }, admin: null };
const ST = { pending: ['In review', 'amber', 'clock'], active: ['Active', 'blue', 'play'], done: ['Completed', 'green', 'check'], rejected: ['Rejected', 'coral', 'x'], approved: ['Approved', 'green', 'check'], live: ['Live', 'blue', 'play'], queued: ['Scheduled', 'amber', 'clock'], posting: ['Posting', 'blue', 'clock'], failed: ['Failed', 'coral', 'x'], missed: ['Missed', 'coral', 'x'], removed: ['Removed', 'coral', 'x'], closing: ['Finishing', 'blue', 'clock'], paid: ['Paid', 'green', 'check'], cancelled: ['Cancelled', 'coral', 'x'] };
const badge = s => { const [x, c, i] = ST[s] || [s, 'amber', 'clock']; return `<span class="badge b-${c}">${ico(i)}${x}</span>`; };
const pkOf = k => S.me.packages.find(p => p.key === k);
const empty = (i, txt) => `<div class="empty">${ico(i)}<div>${txt}</div></div>`;

// ---------- chrome ----------
const NAVS = { advertiser: [['explore', 'compass', 'Explore'], ['ads', 'spark', 'TG Ads'], ['fb', 'globe', 'FB & IG'], ['tt', 'music', 'TikTok'], ['wallet', 'wallet', 'Wallet']], publisher: [['chan', 'chan', 'Channels'], ['earn', 'wallet', 'Earnings']] };
function drawTop() {
  const m = S.me;
  $('#top').innerHTML = `<div class="seg"><button data-m="advertiser" class="${S.mode === 'advertiser' ? 'on' : ''}">Advertiser</button><button data-m="publisher" class="${S.mode === 'publisher' ? 'on' : ''}">Publisher</button></div><span class="sp"></span><button class="ib" id="tm" aria-label="Dark mode">${ico('moon')}</button><button class="wchip" id="wc">${ico('wallet')}${nf(m ? m.me.balance : 0)} ETB</button>`;
  $$('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; S.tab = S.mode === 'publisher' ? 'chan' : 'explore'; hap(); render(); scrollTo(0, 0); });
  $('#tm').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; ls.set('theme', theme); applyTheme(); };
  $('#wc').onclick = () => go(S.mode === 'publisher' ? 'earn' : 'wallet');
}
function drawNav() {
  const tabs = [...NAVS[S.mode]]; if (S.mode === 'publisher' && S.me && S.me.isAdmin) tabs.push(['admin', 'shield', 'Admin']);
  $('#nav').innerHTML = tabs.map(([k, i, n]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${ico(i)}${n}</button>`).join('');
  $$('#nav [data-t]').forEach(b => b.onclick = () => go(b.dataset.t));
}
const go = k => { S.tab = k; hap(); render(); scrollTo(0, 0); };
function render() {
  if (!S.me) return;
  drawTop(); drawNav();
  const inFlow = S.mode === 'advertiser' && S.tab === 'explore' && S.flow;
  $('#nav').style.display = inFlow ? 'none' : ''; document.body.classList.toggle('flow', !!inFlow);
  barwrap.innerHTML = '';
  ({ explore: vExplore, ads: vAds, fb: () => vSoon('Facebook & Instagram'), tt: () => vSoon('TikTok'), wallet: vWallet, chan: vChan, earn: vEarn, admin: vAdmin })[S.tab]();
}
async function load() {
  const [me, ch, mine, wal] = await Promise.all([api('/me'), api('/channels'), api('/mine'), api('/wallet')]);
  const err = me.error || ch.error || mine.error || wal.error;
  if (err) { view.innerHTML = `<div class="card empty">${ico('warn')}<div>${esc(err)}</div><button class="btn" id="rt">Try again</button></div>`; $('#rt').onclick = load; return; }
  S.me = me; S.channels = ch; S.mine = mine; S.wallet = wal; render();
}

// ---------- Explore + booking flow ----------
const newFlow = (ch, p) => ({ ch, step: 1, max: 1, pkg: null, date: eatToday(), hours: [], taken: null, kind: p ? p.kind : 'text', label: p ? p.label : '', html: p ? p.html : '', pm: p ? p.parse_mode : 'HTML', photos: p ? p.photos.map(id => ({ id, url: '/media/' + id })) : [], btnT: p ? p.btn_text : '', btnU: p ? p.btn_url : '', pv: false, pay: 'wallet', tx: '', sn: '', sp: '', receipt: null, coupon: '', cpCode: '', cp: 0, busy: false, done: null });
function openFlow(c, prev) { S.mode = 'advertiser'; S.tab = 'explore'; S.flow = newFlow(c, prev); render(); scrollTo(0, 0); }
function vExplore() {
  if (S.flow) return vFlow();
  const f = S.q.trim().toLowerCase();
  const list = S.channels.filter(c => (S.cat === 'all' || c.category === S.cat) && (!f || (c.title + ' ' + c.username).toLowerCase().includes(f)))
    .sort((a, b) => S.sort === 'lo' ? a.prices.single - b.prices.single : S.sort === 'hi' ? b.prices.single - a.prices.single : b.subs - a.subs);
  view.innerHTML = `<div class="search">${ico('search')}<input id="q" placeholder="Search channels" value="${esc(S.q)}"></div>
  <div class="hs" id="cats">${['all', ...S.me.cats].map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-c="${c}">${cap(c)}</button>`).join('')}</div>
  <div class="hs" id="sorts">${[['pop', 'Popular'], ['lo', 'Price: low'], ['hi', 'Price: high']].map(([k, n]) => `<button class="chip ${S.sort === k ? 'on' : ''}" data-s="${k}">${n}</button>`).join('')}</div>
  <div id="list">${chList(list)}</div>`;
  $('#q').oninput = e => { S.q = e.target.value; vExploreList(); };
  $$('#cats .chip').forEach(b => b.onclick = () => { S.cat = b.dataset.c; hap(); vExplore(); });
  $$('#sorts .chip').forEach(b => b.onclick = () => { S.sort = b.dataset.s; hap(); vExplore(); });
  bindList();
}
function vExploreList() { const f = S.q.trim().toLowerCase(); const list = S.channels.filter(c => (S.cat === 'all' || c.category === S.cat) && (!f || (c.title + ' ' + c.username).toLowerCase().includes(f))).sort((a, b) => S.sort === 'lo' ? a.prices.single - b.prices.single : S.sort === 'hi' ? b.prices.single - a.prices.single : b.subs - a.subs); $('#list').innerHTML = chList(list); bindList(); }
const chList = list => list.length ? list.map(c => `<button class="ch" data-id="${c.id}">${av(c)}<div class="m"><b>${esc(c.title)}</b><small>${c.username ? '@' + esc(c.username) : 'Private chat'} · ${kfmt(c.subs)} members · ${cap(c.category)}</small></div><div class="pr"><b>${nf(c.prices.single)} ETB</b><small>per post</small></div></button>`).join('')
  : empty('compass', S.channels.length ? 'No match for your search' : 'No approved channels yet');
const bindList = () => $$('#list .ch').forEach(b => b.onclick = () => { hap(); openFlow(S.channels.find(c => c.id === +b.dataset.id)); });

const flowTotals = f => { const p = pkOf(f.pkg), gross = f.ch.prices[f.pkg] || 0, disc = Math.round(gross * f.cp) / 100; return { p, gross, disc, total: Math.round((gross - disc) * 100) / 100, posts: p ? f.hours.length * p.days : 0 }; };
function vFlow() {
  const f = S.flow; if (f.done) return vFDone();
  const c = f.ch;
  view.innerHTML = `<div class="card"><div class="fh"><button class="ib sq" id="fb" aria-label="Back">${ico('back')}</button>${av(c, 50)}<div class="m"><b>${esc(c.title)}</b><div class="lk">${c.username ? `<a href="#" data-tl="https://t.me/${esc(c.username)}">@${esc(c.username)} ${ico('ext')}</a>` : 'Private chat'}<span>•</span>${ico('users')}${nf(c.subs)}</div></div></div>
  <div class="steps">${['Plan & Schedule', 'Creative', 'Checkout'].map((n, i) => `<button data-s="${i + 1}" class="${f.step === i + 1 ? 'on' : ''} ${i + 1 > f.max ? 'off' : ''}">${i + 1}. ${n}</button>`).join('')}</div></div>` + ['', vF1, vF2, vF3][f.step]();
  $('#fb').onclick = () => { if (f.step > 1) f.step--; else S.flow = null; hap(); render(); scrollTo(0, 0); };
  $$('[data-s]').forEach(b => b.onclick = () => { const s = +b.dataset.s; if (s <= f.max) { f.step = s; render(); scrollTo(0, 0); } });
  $$('[data-tl]').forEach(a => a.onclick = e => { e.preventDefault(); tg.openTelegramLink ? tg.openTelegramLink(a.dataset.tl) : window.open(a.dataset.tl, '_blank'); });
  [null, bind1, bind2, bind3][f.step]();
  drawBar();
}
function bar(txt, dis, fn, green) { barwrap.innerHTML = `<div class="bar"><button class="go ${green ? 'green' : ''}" id="go" ${dis ? 'disabled' : ''}>${txt}</button></div>`; $('#go').onclick = fn; }
function drawBar() {
  const f = S.flow; if (!f || f.done) { barwrap.innerHTML = ''; return; }
  const T = flowTotals(f);
  if (f.step === 1) {
    let t, d = false;
    if (!T.p) { t = '1. Choose a Package Above →'; d = true; }
    else if (!f.hours.length) { t = `Select ${T.p.max > 1 ? 'at least 1' : '1'} posting hour`; d = true; }
    else t = `Next: Compose Ad • ${nf(T.gross)} ETB →`;
    bar(t, d, () => { f.max = Math.max(f.max, 2); f.step = 2; render(); scrollTo(0, 0); });
  } else if (f.step === 2) bar('Review & Checkout →', !creativeOk(f), () => { f.max = 3; f.step = 3; render(); scrollTo(0, 0); });
  else bar(f.busy ? 'Sending…' : `Confirm & Pay ${nf(T.total)} ETB`, f.busy || !payOk(f), submitOrder, true);
}
// step 1 — package + schedule
function vF1() {
  const f = S.flow, p = pkOf(f.pkg), td = eatToday();
  let h = `<div class="card"><div class="cap">${ico('store')}1. Choose ad package</div><p class="sub">Tap One Post, Daily, Weekly, or Monthly first — then choose your start date below.</p><div class="g2">${S.me.packages.map(x => `<button class="pk ${f.pkg === x.key ? 'on' : ''}" data-pk="${x.key}"><small>${esc(x.tag).toUpperCase()}</small><b>${esc(x.name)}</b><h3>${nf(f.ch.prices[x.key])} ETB</h3><span>Flat price • ${x.days > 1 ? x.days + 'd • ' : ''}${x.max > 1 ? 'max ' + x.max + '/day' : '1 post'}</span></button>`).join('')}</div></div>
  <div class="card"><div class="cap">${ico('cal')}2. Start date &amp; post hours<span class="tz">EAT (UTC+3)</span></div>`;
  if (!p) h += `<div class="dash">Tap <b>One Post</b>, <b>Daily</b>, <b>Weekly</b>, or <b>Monthly</b> above to unlock date &amp; time selection.</div>`;
  else {
    h += `<p class="sub">Pick your post date below, then tap your hour slot (EAT).${p.days > 1 ? ` Your hours repeat every day for ${p.days} days.` : ''}</p>
    <div class="box"><div class="r"><b>Post Date:</b><span class="bl">${dlabel(f.date)}</span></div><div class="dn"><button class="btn2" id="pv" ${f.date <= td ? 'disabled' : ''}>‹ Prev</button><input type="date" id="dt" min="${td}" max="${addDays(td, 60)}" value="${f.date}"><button class="btn2" id="nx">Next ›</button></div></div>
    <div class="box"><div class="r"><div><b style="font-size:17px">${dlabel(f.date)}</b><div class="sub">Tap ${p.max > 1 ? 'up to ' + p.max : '1'} posting hour${p.max > 1 ? 's' : ''} (EAT)</div></div><span class="ok-pill">${f.hours.length} / ${p.max} selected</span></div>`;
    for (const [n, a, b] of [['Morning', 6, 11], ['Afternoon', 12, 17], ['Evening', 18, 23]]) {
      h += `<div class="r2"><b>${n}</b><span>${t12(a)} – ${t12(b + 1)} EAT</span></div><div class="g2">`;
      for (let x = a; x <= b; x++) { const off = f.taken === null || f.taken.includes(x) || slotUtc(f.date, x) < Date.now() + LEAD; h += `<button class="slot ${f.hours.includes(x) ? 'on' : ''}" data-h="${x}" ${off ? 'disabled' : ''}><span>${ico('clock')}${pad(x)}:00<em>EAT</em></span><b>${hrange(x)}</b><small>${n}</small></button>`; }
      h += '</div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}
async function loadSlots() {
  const f = S.flow, p = pkOf(f.pkg); f.taken = null; vFlow();
  const r = await api(`/slots?channel=${f.ch.id}&date=${f.date}&days=${p.days}`);
  if (r.error) toast(r.error, true);
  if (S.flow !== f) return;
  f.taken = r.taken || []; f.hours = f.hours.filter(h => !f.taken.includes(h)); vFlow();
}
function bind1() {
  const f = S.flow, p = pkOf(f.pkg), td = eatToday();
  $$('[data-pk]').forEach(b => b.onclick = () => { f.pkg = b.dataset.pk; f.hours = f.hours.slice(0, pkOf(f.pkg).max); hap(); loadSlots(); });
  if (!p) return;
  $('#pv').onclick = () => { f.date = addDays(f.date, -1); f.hours = []; loadSlots(); };
  $('#nx').onclick = () => { f.date = addDays(f.date, 1); f.hours = []; loadSlots(); };
  $('#dt').onchange = e => { if (!e.target.value) return; f.date = e.target.value < td ? td : e.target.value; f.hours = []; loadSlots(); };
  $$('[data-h]').forEach(b => b.onclick = () => {
    const x = +b.dataset.h, i = f.hours.indexOf(x);
    if (i >= 0) f.hours.splice(i, 1);
    else if (p.max === 1) f.hours = [x];
    else if (f.hours.length >= p.max) return toast(`This package allows up to ${p.max} hours per day.`, true);
    else f.hours.push(x);
    f.hours.sort((a, b) => a - b); hap(); vFlow();
  });
}
// step 2 — creative
const creativeOk = f => {
  const t = f.html.trim(), max = f.kind === 'photos' ? 1024 : 4096;
  if (f.kind === 'photos' ? !f.photos.length : !t) return false;
  if (t.length > max || (f.pm === 'HTML' && hasBadHtml(t))) return false;
  if ((f.btnT.trim() || f.btnU.trim()) && (!f.btnT.trim() || !/^https?:\/\/\S+$/i.test(f.btnU.trim()))) return false;
  return true;
};
function bubble(f) {
  const imgs = f.kind === 'photos' ? f.photos : [];

function bind2() {
  const f = S.flow;
  $('#tc').onclick = () => { f.pv = false; vFlow(); }; $('#tp').onclick = () => { f.pv = true; vFlow(); };
  if (f.pv) return;
  $$('[data-k]').forEach(b => b.onclick = () => { f.kind = b.dataset.k; vFlow(); });
  const chk = () => {
    const max = f.kind === 'photos' ? 1024 : 4096; $('#cn').textContent = f.html.length + ' / ' + max;
    $('#he').textContent = f.pm === 'HTML' && f.html && hasBadHtml(f.html) ? 'Invalid HTML. Use only b, i, u, s, code, pre, a href="https://…". Write other < > & as &lt; &gt; &amp;.' : f.html.length > max ? `Too long (max ${max}).` : '';
    drawBar();
  };
  $('#lb').oninput = e => { f.label = e.target.value; };
  $('#tx').oninput = e => { f.html = e.target.value; chk(); };
  $('#pm').onchange = e => { f.pm = e.target.value; chk(); };
  $('#bt').oninput = e => { f.btnT = e.target.value; drawBar(); }; $('#bu').oninput = e => { f.btnU = e.target.value; drawBar(); };
  chk();
  if (f.kind === 'photos') {
    $$('[data-rm]').forEach(b => b.onclick = () => { f.photos.splice(+b.dataset.rm, 1); vFlow(); });
    if ($('#clr')) $('#clr').onclick = () => { f.photos = []; vFlow(); };
    if ($('#ph')) $('#ph').onchange = async e => {
      const fs = [...e.target.files].slice(0, 5 - f.photos.length); if (!fs.length) return;
      toast('Uploading…');
      for (const file of fs) { try { const r = await up(file, 1280); if (r.error) { toast(r.error, true); break; } f.photos.push({ id: r.id, url: '/media/' + r.id }); } catch (err) { toast('Could not read this image.', true); } }
      if (S.flow === f) vFlow();
    };
  }
}

function bind3() {
  const f = S.flow;
  $$('[data-p]').forEach(b => b.onclick = () => { f.pay = b.dataset.p; hap(); vFlow(); });
  $('#cpn').oninput = e => { f.coupon = e.target.value; };
  $('#cpb').onclick = async () => {
    const c = f.coupon.trim().toUpperCase(); if (!c) { f.cp = 0; f.cpCode = ''; return vFlow(); }
    const r = await api('/coupon?code=' + encodeURIComponent(c));
    if (r.error) { f.cp = 0; f.cpCode = ''; toast(r.error, true); } else { f.cp = r.percent; f.cpCode = c; toast(`Coupon applied: ${r.percent}% off`); }
    vFlow();
  };
  $$('[data-cp]').forEach(b => b.onclick = () => copy(b.dataset.cp, 'Account number copied'));
  if (f.pay === 'bank') {
    $('#tx').oninput = e => { f.tx = e.target.value; drawBar(); }; $('#sn').oninput = e => { f.sn = e.target.value; }; $('#sp').oninput = e => { f.sp = e.target.value; };

}
async function submitOrder() {

  const r = await api('/admin/stats'); if (r.error) { view.innerHTML = `<div class="card empty">${ico('warn')}<div>${esc(r.error)}</div></div>`; return; }
  const s = r.stats;
  view.innerHTML = `
  <div class="card"><div class="cap">Dashboard</div><div class="g2"><div class="stat"><small>Users</small><b>${s.users}</b></div><div class="stat"><small>Channels</small><b>${s.channels}</b></div><div class="stat"><small>Live posts</small><b>${s.live}</b></div><div class="stat"><small>Paid orders</small><b>${s.paid_orders}</b></div></div>
    <div class="stat" style="margin-top:10px"><small>Revenue</small><b style="color:var(--p)">${nf(s.revenue)} ETB</b></div></div>
  <div class="card"><div class="cap">Waiting for approval</div><p class="sub" style="margin-top:0">Approve or reject with the buttons in the bot chat.</p><div class="g2"><div class="stat"><small>Orders</small><b>${r.pendingOrders.length}</b></div><div class="stat"><small>Top-ups</small><b>${r.pendingTopups.length}</b></div><div class="stat"><small>Channels</small><b>${r.pendingChannels.length}</b></div><div class="stat"><small>Withdrawals</small><b>${r.pendingWd.length}</b></div></div></div>
  <div class="card"><div class="cap">${ico('shield')}Block or unblock a user</div><input id="uid" inputmode="numeric" placeholder="User ID"><div class="two"><button class="btn red sm" id="bn">Block</button><button class="btn soft sm" id="ub">Unblock</button></div></div>
  <div class="card"><div class="cap">Coupons</div>${r.coupons.map(c => `<div class="row"><div class="m"><b>${esc(c.code)}</b><br><small>${c.percent}% · ${c.uses} uses left</small></div></div>`).join('')}
    <label class="l">Code</label><input id="cc" autocapitalize="characters"><label class="l">Percent</label><input id="cp" type="number" inputmode="numeric" placeholder="10"><label class="l">Uses</label><input id="cu" type="number" inputmode="numeric" placeholder="50">
    <button class="btn" id="sc">Save coupon</button></div>`;
  const ban = v => async () => { const x = await api('/admin/ban', { user_id: $('#uid').value, ban: v }); x.error ? toast(x.error, true) : toast('Done'); };
  $('#bn').onclick = ban(true); $('#ub').onclick = ban(false);
  $('#sc').onclick = async () => { const x = await api('/admin/coupon', { code: $('#cc').value, percent: $('#cp').value, uses: $('#cu').value }); x.error ? toast(x.error, true) : (toast('Done'), vAdmin()); };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && ['ads', 'wallet', 'earn'].includes(S.tab)) load(); });
load();
</script>
</body>
</html>
