<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addis Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#0d1b2e;--mute:#5b6b83;--line:#e2e8f1;--soft:#f5f8fc;--p:#1b86e8;--amber:#f5a524;--coral:#e5484d;--green:#0e9f6e;--disp:'Bricolage Grotesque','Noto Sans Ethiopic',system-ui,sans-serif}
body[data-mode=publisher]{--p:#0e9f6e}
[data-theme=dark]{--bg:#09111f;--card:#111c2f;--ink:#e9f0fa;--mute:#93a3bd;--line:#1f2d46;--soft:#15233b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,'Noto Sans Ethiopic',system-ui,sans-serif;overflow-wrap:anywhere;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));transition:background .3s}
body.flow{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.typing nav,body.typing .bar{display:none}
.shell{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top */
.top{position:sticky;top:0;z-index:8;padding:10px 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.top .shell{display:flex;align-items:center;gap:8px}
.seg{display:flex;flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--p);color:#fff}
.sp{flex:1}
.ib{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.wchip{display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;white-space:nowrap}.wchip .i{color:var(--p);width:18px;height:18px}
main{padding:6px 12px 12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.hero{border-radius:26px;border:0;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--p) 88%,#000),var(--p) 55%,color-mix(in srgb,var(--p) 70%,#fff))}
.sec{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}.sec .i{color:var(--p)}
.sub{font-size:13.5px;color:var(--mute)}.sub b{color:var(--ink)}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{font-family:var(--disp);font-weight:800}
/* chips */
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent)}.badge .i{width:13px;height:13px;stroke-width:2.6}
.b-amber{color:#c47a05}.b-blue{color:#1b86e8}.b-green{color:#0e9f6e}.b-coral{color:var(--coral)}.b-mute{color:var(--mute)}
[data-theme=dark] .b-amber{color:#f5b64c}
/* forms */
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
input[type=file]{background:var(--soft);padding:10px}
textarea{min-height:140px;resize:vertical}
select{width:auto;padding:7px 30px 7px 12px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px}
label.l{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.err{color:var(--coral);font-size:13px;margin-top:6px}
.btn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5}.btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.red{background:color-mix(in srgb,var(--coral) 13%,transparent);color:var(--coral)}.btn.sm{padding:11px;font-size:14px;margin-top:0}
.btn.ghost{background:none;border:1.5px solid var(--p);color:var(--p)}
.two{display:flex;gap:8px;margin-top:12px}.two .btn{margin-top:0}
.lnk{border:0;background:none;color:var(--p);font-weight:700;display:flex;align-items:center;gap:4px;padding:4px}
/* stepper */
.prog{display:flex;gap:6px;margin:4px 0 14px}.prog button{flex:1;border:0;background:none;padding:0;text-align:left;color:var(--mute);font-weight:700;font-size:13px}
.prog i{display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:6px}.prog .on{color:var(--ink)}.prog .on i,.prog .ok i{background:var(--p)}.prog .off{opacity:.55}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.fh b{display:block;font-family:var(--disp);font-size:18px;line-height:1.2}
.lk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13.5px;flex-wrap:wrap}.lk a{color:var(--p);font-weight:600;text-decoration:none}.lk .i{width:15px;height:15px}
.av{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:19px;flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* package rows */
.pk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border:1.5px solid var(--line);border-radius:16px;background:var(--card)}
.pk .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pk.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--card))}.pk.on .rd{border-color:var(--p)}.pk.on .rd:after{content:'';width:10px;height:10px;border-radius:50%;background:var(--p)}
.pk .m{flex:1}.pk b{font-family:var(--disp);font-size:16px}.pk .pr{font-family:var(--disp);font-weight:800;font-size:18px;text-align:right}.pk .pr small{display:block;font:500 12px Figtree;color:var(--mute)}
.bud{margin-top:10px;padding:12px;border-radius:14px;background:var(--soft)}
/* hour dial */
.dial{margin-top:10px}.dp{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-weight:700;font-size:13px}.dp span{color:var(--mute);font-weight:500;font-size:12px}
.hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hc{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 6px;text-align:center;line-height:1.1}
.hc b{display:block;font-family:var(--disp);font-size:16px}.hc small{font-size:10.5px;color:var(--mute)}
.hc.on{background:var(--p);border-color:var(--p);color:#fff}.hc.on small{color:#ffffffcc}
.hc:disabled{opacity:.42;background:var(--soft)}
.hc.taken:disabled{background:repeating-linear-gradient(135deg,var(--soft) 0 5px,var(--line) 5px 7px);opacity:.8}.hc.taken b{text-decoration:line-through}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* creative */
.tabs2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.tabs2 button{flex:1;border:0;background:none;border-radius:12px;padding:11px 6px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.tabs2 button.on{background:var(--ink);color:var(--card)}
.kt{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-weight:700}.kt.on{border-color:var(--p);color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--card))}
.pbox{border:1.5px dashed var(--line);background:var(--soft);border-radius:16px;padding:12px;margin-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.th i{position:absolute;left:5px;top:5px;background:#0d1b2eb0;color:#fff;font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:7px}
.th button{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;border:0;background:#0d1b2eb0;color:#fff;display:grid;place-items:center;padding:0}.th button .i{width:13px;height:13px}
.addp{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--p);font-size:12.5px;font-weight:700;cursor:pointer}
.lr{display:flex;align-items:center;gap:8px;margin-top:14px}.lr label{flex:1;margin:0;font-weight:700;font-size:14px}.cnt{color:var(--mute);font-size:12.5px}
.tgbg{background:#cfe0ef;border-radius:16px;padding:12px}[data-theme=dark] .tgbg{background:#0c1829}
.bub{background:#fff;color:#111;border-radius:14px 14px 14px 4px;max-width:96%;word-break:break-word;font-size:14.5px;overflow:hidden}[data-theme=dark] .bub{background:#1c2b42;color:#e9f0fa}
.bub .bn{padding:7px 10px 3px;color:#1b86e8;font-weight:700;font-size:14px}.bub .t{padding:4px 10px 4px}.bub .hint{color:#8a9bb4}.bub a{color:#1b86e8;pointer-events:none}.bub code,.bub pre{background:#0001;border-radius:4px;padding:0 3px}
.bub .ft{padding:0 10px 6px;text-align:right;font-size:11.5px;color:#8a9bb4}
.pg{display:grid;gap:2px}.pg img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1}.pg1{grid-template-columns:1fr}.pg1 img{aspect-ratio:auto;max-height:320px}.pg2,.pg4{grid-template-columns:1fr 1fr}.pg3{grid-template-columns:1fr 1fr}.pg3 img:first-child{grid-column:span 2;aspect-ratio:2/1}.pg5{grid-template-columns:repeat(3,1fr)}
.cta{max-width:96%;margin-top:3px;text-align:center;font-weight:700;color:#fff;background:#3d4f66;border-radius:10px;padding:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mute)}.kv b{color:var(--ink);text-align:right}
.kv.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:19px;color:var(--ink)}.kv.tot b{font-family:var(--disp);color:var(--p)}
.pm{padding:14px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;text-align:left}.pm.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--card))}.pm .i{color:var(--p)}.pm b{display:block;margin-top:6px;font-family:var(--disp)}.pm small{color:var(--mute)}
.bank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--p);border-radius:16px;background:color-mix(in srgb,var(--p) 7%,var(--card));width:100%;text-align:left;margin-top:8px}.bank b{display:block;font-family:var(--disp)}.bank small{color:var(--mute)}
.bank .num{display:flex;align-items:center;gap:6px;color:var(--p);font-weight:800;white-space:nowrap}
.warn{background:#fff6dc;color:#8a4b0a;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}[data-theme=dark] .warn{background:#3a2d0c;color:#f5c26b}
/* explore */
.search{position:relative;margin-bottom:8px}.search .i{position:absolute;left:14px;top:13px;color:var(--mute)}.search input{padding-left:42px;border-radius:99px}
.ch{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.ch .m{flex:1}.ch .m b{display:block;font-family:var(--disp);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch small{color:var(--mute)}.ch .pr{text-align:right}.ch .pr b{color:var(--p);overflow:visible}
.soon{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mute);font-size:13.5px}
/* wallet / stats */
.wal{border-radius:24px;padding:20px;background:var(--ink);color:var(--card);margin-bottom:12px}[data-theme=dark] .wal{background:#050b16;color:#e9f0fa}
.wal .big{font-family:var(--disp);font-size:40px;font-weight:800;margin:6px 0 2px;line-height:1.1}.wal .big small{font-size:18px;opacity:.7}.wal .acc{opacity:.65;font-size:14px}
.tabs3{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}.tabs3 button{flex:1;border:0;background:none;border-radius:12px;padding:11px 4px;font-weight:700;color:var(--mute);font-size:14px}.tabs3 button.on{background:var(--ink);color:var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .m{flex:1}.row small{color:var(--mute)}
.it{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.it span{flex:1}.it small{color:var(--mute)}
.rowh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;gap:10px}.rowh h2{font-size:22px}
.empty{text-align:center;color:var(--mute);padding:26px 12px}.empty .i{width:34px;height:34px;margin-bottom:8px;color:var(--p)}
.ok-big{width:68px;height:68px;border-radius:50%;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);display:grid;place-items:center;margin:2px auto 10px}.ok-big .i{width:34px;height:34px;stroke-width:3;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.code{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:1px;text-align:center;color:var(--p)}
.stat{padding:12px;border-radius:14px;background:var(--soft)}.stat small{display:block;color:var(--mute);font-size:12.5px}.stat b{font-family:var(--disp);font-size:20px}
.amt-p{color:var(--green);font-weight:700}.amt-m{color:var(--coral);font-weight:700}
.box{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.mini{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px;margin-top:8px;flex-wrap:wrap}.mini b{color:var(--ink)}
.okc{color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px;font-size:13px}.okc.bad{color:var(--coral)}.okc .i{width:16px;height:16px}
.pv{border-radius:14px;background:var(--soft);padding:10px;margin-top:10px}.pv .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pv img.c{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px}
/* nav + bars */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .shell{display:flex;padding:6px 6px 4px}
nav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:4px 0;position:relative}
nav button .i{width:24px;height:24px}nav button.on{color:var(--p)}nav .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .shell{display:block}
.go{width:100%;padding:16px;border:0;border-radius:16px;background:var(--p);color:#fff;font-family:var(--disp);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}.go:disabled{opacity:.45}
.toast{position:fixed;left:12px;right:12px;top:10px;max-width:536px;margin:0 auto;padding:12px 14px;border-radius:14px;background:#17263c;color:#fff;z-index:30;display:flex;gap:10px;align-items:center;transform:translateY(-120px);transition:transform .25s;box-shadow:0 10px 28px #0005}.toast.show{transform:none}.toast.err{background:#b4233f}
.skel{border-radius:20px;height:110px;margin-bottom:12px;background:linear-gradient(90deg,var(--card) 25%,var(--soft) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
/* welcome */
#splash{position:fixed;inset:0;z-index:50;background:#08111f;display:grid;place-items:center;align-content:center;gap:14px;color:#fff;transition:opacity .45s,visibility .45s}#splash.out{opacity:0;visibility:hidden}
#splash svg{width:112px;height:112px}.ring{fill:none;stroke:#1b86e8;stroke-width:5;stroke-linecap:round;stroke-dasharray:290;stroke-dashoffset:290;animation:dr .9s .1s ease-out forwards;transform-origin:60px 60px;transform:rotate(-90deg)}
.tk{stroke:#7cc2ff;stroke-width:3;stroke-linecap:round;opacity:0;animation:fi .3s calc(.6s + var(--i)*.04s) forwards}.hand{stroke:#f5a524;stroke-width:5;stroke-linecap:round;transform-origin:60px 60px;animation:sp 1s .45s cubic-bezier(.3,.7,.2,1) both}.dotc{fill:#f5a524}
.wd{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex}.wd span{opacity:0;transform:translateY(14px);animation:rise .45s calc(.7s + var(--i)*.05s) forwards}
#splash p{margin:0;color:#9db4d3;font-size:14px;opacity:0;animation:fi .5s 1.15s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}@keyframes rise{to{opacity:1;transform:none}}@keyframes sp{from{transform:rotate(-200deg)}to{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}.skel{animation:none}.toast{transition:none}}
@media(max-width:340px){.seg button{padding:8px 9px;font-size:13px}.wchip{padding:0 10px}.hrs{gap:4px}}
.ib{position:relative}.nb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.nt{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.nt:first-child{border-top:0}.nic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--p)}.nt.new .nic{background:var(--p);color:#fff}
.cht{width:100%;height:auto;display:block;margin-top:10px}.cht rect{fill:var(--p)}.cht text{fill:var(--mute);font-size:9px}
.hb{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}.hb span{flex:none;width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .bw{flex:1;height:8px;border-radius:6px;background:var(--soft)}.hb i{display:block;height:8px;border-radius:6px;background:var(--p)}.hb b{flex:none}
.rcp{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--soft);margin-top:8px}
</style>

<script>

// ---------- helpers ----------

const EAT = 3 * 3600e3, LEAD = 10 * 60e3;

const dlabel = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });

async function api(p, body) {

}
const AT = [['stats', 'Overview'], ['appr', 'Approvals'], ['users', 'Users'], ['coup', 'Coupons'], ['an', 'Analytics']];
const who = (id, name, un) => esc(un ? '@' + un : name || String(id)) + ' · ' + id;
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
function bars(rows, val, lab) {
  if (!rows.length) return empty('chart', 'No data yet');
  const W = 320, H = 110, m = Math.max(1, ...rows.map(val)), n = rows.length, bw = W / n;
  return `<svg class="cht" viewBox="0 0 ${W} ${H + 16}">${rows.map((r, i) => { const h = Math.round(val(r) / m * H); return `<rect x="${(i * bw + bw * .15).toFixed(1)}" y="${H - h}" width="${(bw * .7).toFixed(1)}" height="${Math.max(h, val(r) > 0 ? 2 : 0)}" rx="2"><title>${esc(lab(r))}: ${nf(val(r))}</title></rect>`; }).join('')}<text x="0" y="${H + 12}">${esc(lab(rows[0]))}</text><text x="${W}" y="${H + 12}" text-anchor="end">${esc(lab(rows[n - 1]))}</text></svg>`;
}
const hbars = (rows, val, lab, sub) => rows.length ? rows.map(r => `<div class="hb"><span>${esc(lab(r))}</span><div class="bw"><i style="width:${Math.max(3, Math.round(val(r) / Math.max(1, val(rows[0])) * 100))}%"></i></div><b>${sub(r)}</b></div>`).join('') : empty('chart', 'No data yet');
async function vAdmin() {
  const t = S.at, hd = `<div class="rowh"><h2>Admin</h2><button class="ib" id="rf" aria-label="Refresh">${ico('refresh')}</button></div><div class="hs">${AT.map(([k, n]) => `<button class="chip ${t === k ? 'on' : ''}" data-at="${k}">${n}</button>`).join('')}</div>`;
  view.innerHTML = hd + '<div class="skel"></div><div class="skel"></div>';
  const bindHd = () => { $('#rf').onclick = vAdmin; $$('[data-at]').forEach(b => b.onclick = () => { S.at = b.dataset.at; vAdmin(); }); };
  const r = t === 'appr' ? await api('/admin/queue') : t === 'users' ? await api('/admin/users?q=' + encodeURIComponent(S.au)) : t === 'an' ? await api('/admin/analytics') : await api('/admin/stats');
  if (r.error) { view.innerHTML = hd + `<div class="card empty">${ico('warn')}<div>${esc(r.error)}</div></div>`; bindHd(); return; }
  let h = '';
  if (t === 'stats') {
    const s = r.stats;
    h = `<div class="card"><div class="g2"><div class="stat"><small>Users</small><b>${s.users}</b></div><div class="stat"><small>Channels</small><b>${s.channels}</b></div><div class="stat"><small>Live posts</small><b>${s.live}</b></div><div class="stat"><small>In owner review</small><b>${s.in_review}</b></div></div><div class="stat" style="margin-top:10px"><small>Revenue</small><b style="color:var(--p)">${nf(s.revenue)} ETB</b></div></div>
    <div class="card"><div class="sec">Waiting for you</div><div class="sub">Tap to open Approvals. Buttons in the bot chat still work too.</div><div class="g2" style="margin-top:10px">${[['Bank payments', r.pendingOrders], ['Top-ups', r.pendingTopups], ['Channels', r.pendingChannels], ['Withdrawals', r.pendingWd]].map(([n, l]) => `<button class="stat" data-at="appr" style="border:0;text-align:left"><small>${n}</small><b style="color:${l.length ? 'var(--coral)' : 'inherit'}">${l.length}</b></button>`).join('')}</div></div>`;
  } else if (t === 'appr') {
    const act = (k, id) => `<div class="two"><button class="btn red sm" data-d="${k}:${id}:0">${ico('x')}Reject</button><button class="btn sm" data-d="${k}:${id}:1">${ico('check')}Approve</button></div>`;
    const rc = x => x ? `<a href="/media/${esc(x)}" target="_blank"><img class="rcp" src="/media/${esc(x)}" loading="lazy" alt="Receipt"></a>` : '';
    const sec = (title, arr, fn) => arr.length ? `<div class="card"><div class="sec">${title} <span class="badge b-amber" style="margin-left:auto">${arr.length}</span></div>${arr.map(x => `<div class="box">${fn(x)}</div>`).join('')}</div>` : '';
    h = sec('Bank payments', r.orders, o => `<div class="r"><b>AD${o.id}</b><b class="pt">${nf(o.total)} ETB</b></div><div class="sub">${esc(o.ctitle)} · ${esc((pkOf(o.pkg) || {}).name || o.pkg || '')}${o.discount ? ' · discount ' + nf(o.discount) : ''}</div><div class="sub">${who(o.user_id, o.uname, o.uuser)}</div><div class="sub">Tx: <b>${esc(o.tx_number || '-')}</b> · ${esc(o.sender_name || '')} ${esc(o.sender_phone || '')}</div>${rc(o.receipt)}<p class="sub" style="margin:8px 0 0">Approve only if the money arrived. The channel owner then reviews the ad.</p>${act('order', o.id)}`)
      + sec('Top-ups', r.topups, p => `<div class="r"><b>#${p.id}</b><b class="pt">${nf(p.amount)} ETB</b></div><div class="sub">${who(p.user_id, p.uname, p.uuser)}</div><div class="sub">Tx: <b>${esc(p.tx_number || '-')}</b> · ${esc(p.sender_name || '')} ${esc(p.sender_phone || '')}</div>${rc(p.receipt)}${act('topup', p.id)}`)
      + sec('Channel approvals', r.channels, c => `<div class="r"><b>${esc(c.title)}</b><span class="tag">${c.type === 'channel' ? 'Channel' : 'Group'}</span></div><div class="sub">${c.username ? '@' + esc(c.username) + ' · ' : ''}${nf(c.subs)} members</div><div class="sub">Owner: ${who(c.owner_id, c.uname, c.uuser)}</div>${act('channel', c.id)}`)
      + sec('Withdrawals', r.withdrawals, w => `<div class="r"><b>#${w.id}</b><b class="pt">${nf(w.amount)} ETB</b></div><div class="sub">${who(w.user_id, w.uname, w.uuser)}</div><div class="sub">${esc(w.method)}: <b>${esc(w.account)}</b></div><div class="two"><button class="btn red sm" data-d="withdraw:${w.id}:0">${ico('x')}Reject + refund</button><button class="btn sm" data-d="withdraw:${w.id}:1">${ico('check')}Mark paid</button></div>`);
    if (!h) h = `<div class="card">${empty('shield', 'Nothing is waiting for you')}</div>`;
  } else if (t === 'users') {
    h = `<div class="card"><div class="search" style="margin:0">${ico('search')}<input id="us" placeholder="User ID, name or @username" value="${esc(S.au)}"></div><button class="btn sm" id="ug" style="margin-top:10px">Search</button></div>
    <div class="card">${r.users.length ? r.users.map(u => `<div class="row"><div class="m"><b>${esc(u.name || 'User')}</b> ${u.banned ? '<span class="badge b-coral">Blocked</span>' : ''}<br><small>${u.id}${u.username ? ' · @' + esc(u.username) : ''} · ${nf(u.balance)} ETB</small></div><button class="btn sm ${u.banned ? 'soft' : 'red'}" style="width:auto;padding:0 14px;height:40px" data-b="${u.id}:${u.banned ? 0 : 1}">${u.banned ? 'Unblock' : 'Block'}</button></div>`).join('') : empty('users', 'No users found')}</div>`;
  } else if (t === 'coup') {
    h = `<div class="card"><div class="sec">Coupons</div>${r.coupons.length ? r.coupons.map(c => `<div class="row"><div class="m"><b>${esc(c.code)}</b><br><small>${c.percent}% · ${c.uses} uses left</small></div><button class="btn red sm" style="width:auto;padding:0 14px;height:40px" data-cd="${esc(c.code)}">${ico('trash')}</button></div>`).join('') : empty('gift', 'No coupons yet')}</div>
    <div class="card"><div class="sec">Create or update</div><label class="l">Code</label><input id="cc" autocapitalize="characters"><div class="g2"><div><label class="l">Percent</label><input id="cp" type="number" inputmode="numeric" placeholder="10"></div><div><label class="l">Uses</label><input id="cu" type="number" inputmode="numeric" placeholder="50"></div></div><button class="btn" id="sc">Save coupon</button><p class="sub">Saving an existing code replaces its percent and uses.</p></div>`;
  } else {
    const PS = { daily: ['Daily', r.daily, x => x.k.slice(5)], weekly: ['Weekly', r.weekly, x => 'wk ' + x.k.slice(5)], monthly: ['Monthly', r.monthly, x => x.k] }, P = PS[S.ap] || PS.daily, sh = 100 - S.me.ownerShare, c = r.conv;
    const rev = P[1].reduce((a, x) => a + x.rev, 0), ord = P[1].reduce((a, x) => a + x.n, 0);
    h = `<div class="hs">${Object.entries({ daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' }).map(([k, n]) => `<button class="chip ${S.ap === k ? 'on' : ''}" data-ap="${k}">${n}</button>`).join('')}</div>
    <div class="card"><div class="sec">${ico('spark')}${P[0]} revenue</div><div class="g3" style="margin-top:8px"><div class="stat"><small>Revenue</small><b>${nf(rev)}</b></div><div class="stat"><small>Earnings (${sh}%)</small><b style="color:var(--p)">${nf(rev * sh / 100)}</b></div><div class="stat"><small>Orders</small><b>${ord}</b></div></div>${bars(P[1], x => x.rev, P[2])}</div>
    <div class="card"><div class="sec">${ico('chan')}Top channels</div><div class="sub">By ad value posted</div>${hbars(r.top, x => x.gross, x => x.title, x => nf(x.gross) + ' ETB')}</div>
    <div class="card"><div class="sec">${ico('users')}Advertiser activity</div><div class="sub">Most active advertisers</div>${r.advertisers.length ? r.advertisers.map(a => `<div class="row"><div class="m"><b>${esc(a.username ? '@' + a.username : a.name || a.id)}</b><br><small>${a.n} order${a.n === 1 ? '' : 's'}</small></div><b>${nf(a.spent)} ETB</b></div>`).join('') : empty('users', 'No orders yet')}</div>
    <div class="card"><div class="sec">${ico('check')}Conversion rate</div><div class="g3" style="margin-top:8px"><div class="stat"><small>Order → paid</small><b>${pct(c.paid, c.total)}%</b></div><div class="stat"><small>Paid → done</small><b>${pct(c.done, c.paid)}%</b></div><div class="stat"><small>Users who booked</small><b>${pct(c.buyers, c.users)}%</b></div></div><div class="sub" style="margin-top:8px">${c.total} orders · ${c.paid} paid · ${c.done} completed · ${c.rejected} rejected · ${c.buyers} of ${c.users} users booked</div></div>`;
  }
  view.innerHTML = hd + h; bindHd();
  $$('[data-ap]').forEach(b => b.onclick = () => { S.ap = b.dataset.ap; vAdmin(); });
  $$('[data-d]').forEach(b => b.onclick = () => { const [k, id, a] = b.dataset.d.split(':'), ok = a === '1';
    const run = async () => { b.disabled = true; const x = await api('/admin/decide', { kind: k, id: +id, approve: ok }); x.error ? toast(x.error, true) : toast(x.note); vAdmin(); };
    if (!ok && tg.showConfirm) tg.showConfirm('Reject this request?', y => y && run()); else run(); });
  if (t === 'users') {
    const go2 = () => { S.au = $('#us').value.trim(); vAdmin(); }; $('#ug').onclick = go2; $('#us').onkeydown = e => { if (e.key === 'Enter') go2(); };
    $$('[data-b]').forEach(b => b.onclick = async () => { const [id, v] = b.dataset.b.split(':'); b.disabled = true; const x = await api('/admin/ban', { user_id: id, ban: v === '1' }); x.error ? toast(x.error, true) : toast(v === '1' ? 'User blocked' : 'User unblocked'); vAdmin(); });
  }
  if (t === 'coup') {
    $('#sc').onclick = async () => { const x = await api('/admin/coupon', { code: $('#cc').value, percent: $('#cp').value, uses: $('#cu').value }); x.error ? toast(x.error, true) : (toast('Saved'), vAdmin()); };
    $$('[data-cd]').forEach(b => b.onclick = () => { const run = async () => { await api('/admin/coupon/delete', { code: b.dataset.cd }); toast('Deleted'); vAdmin(); }; tg.showConfirm ? tg.showConfirm('Delete coupon ' + b.dataset.cd + '?', y => y && run()) : run(); });
  }
}

// ---------- Notifications ----------
const NI = { live: 'play', fin_adv: 'check', fin_own: 'wallet', review: 'check', booked: 'cal', approved: 'check', rejected: 'x', expired: 'warn', refund_fail: 'warn', missed: 'warn', removed_own: 'warn', removed_adv: 'warn', cpc_back: 'wallet', ref: 'gift', chan_ok: 'check', chan_no: 'x', wd_paid: 'send', wd_rej: 'x', topup_ok: 'wallet', topup_no: 'x' };
async function pollNotif(first) {
  if (!S.me) return; const N = S.notif, r = await api('/notifications?after=' + N.last); if (r.error || !r.items) return;
  N.unread = r.unread;
  if (r.items.length) {
    N.last = Math.max(N.last, ...r.items.map(x => x.id)); N.items = [...r.items, ...N.items].slice(0, 60);
    if (!first) { toast(r.items[0].title + ' — ' + r.items[0].body); if (['ads', 'wallet', 'over', 'chan'].includes(S.tab) && !document.body.classList.contains('typing')) { await load(); return; } }
  }
  drawTop();
}
async function vNotif() {
  const N = S.notif;
  view.innerHTML = `<div class="rowh"><h2>Notifications</h2><button class="ib" id="rf" aria-label="Refresh">${ico('refresh')}</button></div><div class="card">${N.items.length ? N.items.map(n => `<div class="nt ${n.seen ? '' : 'new'}"><span class="nic">${ico(NI[n.type] || 'bell')}</span><div style="flex:1"><b>${esc(n.title)}</b><div class="sub">${esc(n.body)}</div><div class="sub" style="font-size:12px">${dtime(n.created)}</div></div></div>`).join('') : empty('bell', 'No notifications yet')}</div>`;
  $('#rf').onclick = async () => { await pollNotif(); vNotif(); };
  if (N.unread) { await api('/notifications/read', {}); N.unread = 0; drawTop(); setTimeout(() => N.items.forEach(x => x.seen = 1), 0); }
}

// ---------- start ----------
$('#ticks').innerHTML = Array.from({ length: 12 }, (_, i) => `<line class="tk" style="--i:${i}" x1="60" y1="8" x2="60" y2="${i % 3 ? 13 : 17}" transform="rotate(${i * 30} 60 60)"/>`).join('');
$('#wd').innerHTML = 'Addis Ad'.split('').map((c, i) => `<span style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
const seen = (() => { try { return sessionStorage.getItem('sp'); } catch (e) { return 1; } })();
const t0 = Date.now(), minShow = seen ? 0 : 1700;
if (seen) $('#splash').classList.add('out'); else try { sessionStorage.setItem('sp', '1'); } catch (e) {}
async function boot() {
  await load(); await pollNotif(true);
  const ch = qs.get('ch') || (/^ch_(\d+)$/.exec(sp) || [])[1]; // advertiser link of a channel
  if (ch && S.me) { const c = S.channels.find(x => x.id === +ch); if (c) openFlow(c); else toast('This channel is not available right now.', true); }
  setTimeout(() => $('#splash').classList.add('out'), Math.max(0, minShow - (Date.now() - t0)));
}
boot();
setInterval(() => { if (document.hidden || document.body.classList.contains('typing') || !S.me) return; if (S.tab === 'queue') vQueue(); else if (S.tab === 'ads') load(); else if (S.tab === 'admin' && S.at === 'appr') vAdmin(); }, 60000);
setInterval(() => { if (!document.hidden && S.me) pollNotif(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) { pollNotif(); if (['ads', 'wallet', 'over'].includes(S.tab)) load(); } });
</script>
</body>
</html>
